name: Build Mikael Launcher APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare launcher
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --recursive --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher

      - name: Build APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -n "$(find launcher/app_pojavlauncher/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3-APK
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
