name: Build Mikael Launcher APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete launcher source
        uses: actions/checkout@v4

      - name: Check vendored source
        run: |
          test -f launcher/gradlew
          test -d launcher/app_pojavlauncher
          echo "Building source directly from launcher/ in this repository."

      - name: Build APK
        working-directory: launcher
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -n "$(find launcher/app_pojavlauncher/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3-APK
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v' | sed 's/^v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((patch + 1))"
          fi
          apk=$(find launcher/app_pojavlauncher/build/outputs/apk/debug -name '*.apk' -print -quit)
          mkdir -p release
          cp "$apk" "release/Mikael-Launcher-V${next}.apk"
          gh release create "v${next}" "release/Mikael-Launcher-V${next}.apk"             --title "Mikael Launcher V${next}"             --generate-notes
