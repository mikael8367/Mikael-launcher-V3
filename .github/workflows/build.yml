name: Build Mikael Launcher APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mikael Launcher
        uses: actions/checkout@v4

      - name: Checkout upstream launcher
        run: |
          git clone --recursive --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher
          echo "Using upstream launcher with dynamic Minecraft version metadata."

      - name: Prepare branding
        working-directory: launcher
        run: |
          find app_pojavlauncher/src/main/res -type f -name '*.xml' -print0 | xargs -0 -r sed -i \
            -e 's/Angel Aura Amethyst/Mikael Launcher/g' \
            -e 's/Amethyst Launcher/Mikael Launcher/g' \
            -e 's/PojavLauncher/Mikael Launcher/g'
          # Brand the launcher UI without removing upstream functionality.
          grep -RIl --include='*.xml' 'PojavLauncher\|Amethyst' app_pojavlauncher/src/main/res | \
            xargs -r sed -i -e 's/PojavLauncher/Mikael Launcher/g' -e 's/Amethyst/Mikael Launcher/g'
          # Keep a visible Mikael Launcher build marker in the Android resources.
          mkdir -p app_pojavlauncher/src/main/res/values
          cat > app_pojavlauncher/src/main/res/values/mikael_branding.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="mikael_launcher_name">Mikael Launcher</string>
    <string name="mikael_launcher_subtitle">Minecraft Java • Android</string>
    <string name="mikael_launcher_performance">Performance mode</string>
</resources>
EOF

      - name: Make Gradle executable
        working-directory: launcher
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-debug
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
