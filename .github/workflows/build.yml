name: Build Mikael Launcher APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mikael Launcher
        uses: actions/checkout@v4

      - name: Checkout upstream launcher
        run: |
          git clone --recursive --depth 1 https://github.com/AngelAuraMC/Amethyst-Android.git launcher
          echo "Using upstream launcher with dynamic Minecraft version metadata."

      - name: Prepare branding
        working-directory: launcher
        run: |
          find app_pojavlauncher/src/main/res -type f -name '*.xml' -print0 | xargs -0 -r sed -i \
            -e 's/Angel Aura Amethyst/Mikael Launcher/g' \
            -e 's/Amethyst Launcher/Mikael Launcher/g' \
            -e 's/PojavLauncher/Mikael Launcher/g'
          # Brand the launcher UI without removing upstream functionality.
          grep -RIl --include='*.xml' 'PojavLauncher\|Amethyst' app_pojavlauncher/src/main/res | \
            xargs -r sed -i -e 's/PojavLauncher/Mikael Launcher/g' -e 's/Amethyst/Mikael Launcher/g'
          # Keep a visible Mikael Launcher build marker in the Android resources.
          mkdir -p app_pojavlauncher/src/main/res/values
          cat > app_pojavlauncher/src/main/res/values/mikael_branding.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <string name="mikael_launcher_name">Mikael Launcher</string>
    <string name="mikael_launcher_subtitle">Minecraft Java • Android</string>
    <string name="mikael_launcher_performance">Performance mode</string>
</resources>
EOF

      - name: Make Gradle executable
        working-directory: launcher
        run: chmod +x gradlew

      - name: Validate Gradle
        working-directory: launcher
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: launcher
        run: ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        working-directory: launcher
        run: |
          ls -lah app_pojavlauncher/build/outputs/apk/debug/
          test -n "$(find app_pojavlauncher/build/outputs/apk/debug -name '*.apk' -print -quit)"

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-Launcher-V3-APK
          path: launcher/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30


      - name: Calculate next release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v' | sed 's/^v//' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release
          apk=$(find launcher/app_pojavlauncher/build/outputs/apk/debug -name '*.apk' -print -quit)
          cp "$apk" "release/Mikael-Launcher-V${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Mikael Launcher V${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/Mikael-Launcher-V${{ steps.version.outputs.version }}.apk
